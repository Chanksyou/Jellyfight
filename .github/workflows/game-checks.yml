name: Game checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Guards and story shards run side by side. Shards are balanced by cost in tests/run.mjs
  # (act 1's stories are split across several), so they finish at about the same time.
  stories:
    name: ${{ matrix.shard == 0 && 'Guards' || format('Stories ({0}/8)', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    container:
      # Keep in sync with tests/package.json; the install step checks this pin.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm ci --prefix tests
          node -e "const { version } = require('./tests/node_modules/playwright/package.json'); if (version !== '1.63.0') throw new Error('Update the Playwright container image and version check to match ' + version);"
      - name: Parse modules and run guards
        if: matrix.shard == 0
        run: |
          mkdir -p .wrangler
          node tests/check.mjs | tee .wrangler/ci-guards.log
      - name: Run story shard
        if: matrix.shard != 0
        run: |
          mkdir -p .wrangler
          node tests/run.mjs --shard=${{ matrix.shard }}/8 --jobs=1 --boots=1 --force --seed=20261020 | tee .wrangler/ci-stories.log
      - name: Save logs and failure screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: game-check-results-${{ matrix.shard }}
          path: |
            .wrangler/ci-*.log
            .wrangler/story-failures/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  game-checks:
    name: Game checks
    needs: stories
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the guards and every story shard to pass
        env:
          STORIES_RESULT: ${{ needs.stories.result }}
        run: test "$STORIES_RESULT" = success
