<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jelly Fight · plush shark</title>
<link rel="stylesheet" href="./content/look.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e4e4df;color:#21394a;font:14px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}header,footer{position:absolute;left:24px;right:24px;pointer-events:none}header{top:24px}h1{font-size:26px;letter-spacing:-.04em;margin:7px 0}p{line-height:1.6;margin:6px 0;max-width:390px}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:700;color:#627884}footer{bottom:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,a{pointer-events:auto;border:1px solid #b7c3c6;background:#f7f8f2e8;padding:12px 16px;border-radius:22px;font:inherit;color:inherit;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #2477a5;outline-offset:3px}#stats{width:100%;color:#627884;font-size:11px}#error{position:absolute;inset:40% 24px auto;color:#a32a33}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
</head>
<body>
<canvas aria-label="Interactive 3D plush shark. Drag to rotate, scroll or pinch to zoom."></canvas>
<header><div class="eyebrow">Jelly Fight / Model study</div><h1>A very soft shark.</h1><p>Blue plush, cream belly, embroidered eyes and felt teeth. Drag to turn it over.</p></header>
<footer><button id="side">Side</button><button id="face">Face</button><button id="belly">Belly</button><button id="bedroom" title="Starts a fresh Act 3 preview in this tab">Start fresh in bedroom</button><div id="stats"></div></footer>
<p id="error" hidden></p>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {buildShark} from './src/shark-model.js';
import {loadLook} from './src/look.js';
try {
  await loadLook();
  const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;
  const scene=new THREE.Scene();scene.background=new THREE.Color('#e4e4df');
  const camera=new THREE.PerspectiveCamera(36,1,.01,20);
  const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.14,-.08);controls.enableDamping=true;controls.minDistance=.65;controls.maxDistance=4;
  const shark=buildShark();scene.add(shark);
  scene.add(new THREE.HemisphereLight(0xffffff,0x64758b,2));
  const key=new THREE.DirectionalLight(0xfff7e9,3);key.position.set(-2,3,2);scene.add(key);
  const fill=new THREE.DirectionalLight(0xc1d9ef,1.5);fill.position.set(2,1,-2);scene.add(fill);
  const views={side:[1.4,.78,1.5],face:[.15,.36,1.8],belly:[1,-.9,1.1]};
  const view=name=>{camera.position.fromArray(views[name]);controls.update();};
  view('side');for(const name of Object.keys(views))document.getElementById(name).onclick=()=>view(name);
  document.getElementById('bedroom').onclick=()=>{try{sessionStorage.setItem('jellyfight.act',JSON.stringify({act:3}));location.href='./index.html';}catch{document.getElementById('error').hidden=false;document.getElementById('error').textContent='Browser storage must be enabled to open the bedroom.';}};
  const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
  addEventListener('resize',resize);resize();
  renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
  let triangles=0;shark.traverse(o=>{if(o.isMesh)triangles+=o.geometry.attributes.position.count/3;});
  document.getElementById('stats').textContent=`Original procedural geometry · ${Math.round(triangles).toLocaleString()} triangles · 2 meshes · 1 metre long`;
}catch(error){document.getElementById('error').hidden=false;document.getElementById('error').textContent=`Could not open preview: ${error.message}`;console.error(error);}
</script>
</body>
</html>
