<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jelly Fight · The Great White One</title>
<link rel="stylesheet" href="./content/look.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e4e4df;color:#21394a;font:14px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}header,footer{position:absolute;left:24px;right:24px;pointer-events:none}header{top:24px}h1{font-size:26px;letter-spacing:-.04em;margin:7px 0}p{line-height:1.6;margin:6px 0;max-width:390px}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:700;color:#627884}footer{bottom:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}select{border:1px solid #b7c3c6;border-radius:20px;padding:12px;pointer-events:auto;font:inherit;background:#f7f8f2}button,a{pointer-events:auto;border:1px solid #b7c3c6;background:#f7f8f2e8;padding:12px 16px;border-radius:22px;font:inherit;color:inherit;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #2477a5;outline-offset:3px}#stats{width:100%;color:#627884;font-size:11px}#error{position:absolute;inset:40% 24px auto;color:#a32a33}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
</head>
<body>
<canvas aria-label="Interactive 3D plush shark. Drag to rotate, scroll or pinch to zoom."></canvas>
<header><div class="eyebrow">Jelly Fight / Act 3 boss</div><h1>The Great White One.</h1><p>Animated boss preview. WASD moves the jelly; Space jumps. Drag to orbit. Choose an attack to watch the real controller.</p></header>
<footer style="z-index:10"><select id="attack" aria-label="Boss attack"></select><button id="play-attack">Play attack</button><button id="pause">Pause</button><button id="wide">Arena</button><button id="side">Close-up</button><button id="face">Face</button><button id="belly">Chin</button><button id="frenzy">Toggle frenzy</button><button id="sound">Enable sound</button><button id="bedroom" title="Starts a fresh Act 3 boss fight in this tab">Start fresh boss fight</button><div id="stats"></div></footer>
<p id="error" hidden></p>
<script type="module" src="./src/shark-preview.js"></script>
</body>
</html>
