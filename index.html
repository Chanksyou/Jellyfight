<style>
  html, body { height: 100%; margin: 0; background: #0d1020; overflow: hidden; }
  body { color: #fff; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #0d1020; z-index: 50; transition: opacity .4s; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading h1 { margin: 0 0 12px; font-size: 38px; }
  #loading .bar { width: min(260px, 70vw); height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; margin: 0 auto; }
  #loading .bar { position: relative; }
  #loading .bar i { display: block; height: 100%; width: 100%; background: #ff8ad0; transform-origin: left; transform: scaleX(0); transition: transform .3s; }
  #loading .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, #ffffff66, transparent); animation: jf-shine 1.4s linear infinite; }
  #loading p { opacity: .7; font-size: 13px; margin-top: 10px; }
  /* A jelly that keeps swimming while the page is busy building the game: transform and opacity
     animations run on the browser's compositor, so they move even when the main thread can't */
  #loading .jelly { width: 54px; height: 64px; margin: 0 auto 14px; position: relative; animation: jf-swim 1.6s ease-in-out infinite; }
  #loading .jelly::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 34px; border-radius: 27px 27px 10px 10px; background: radial-gradient(circle at 50% 30%, #ffc2e6, #ff8ad0 70%); box-shadow: 0 0 18px #ff8ad088; }
  #loading .jelly i { position: absolute; top: 30px; width: 4px; height: 30px; border-radius: 2px; background: #ff8ad0aa; transform-origin: top; animation: jf-wave 1.6s ease-in-out infinite; }
  #loading .jelly i:nth-child(1) { left: 12px; } #loading .jelly i:nth-child(2) { left: 25px; animation-delay: -.5s; } #loading .jelly i:nth-child(3) { left: 38px; animation-delay: -1s; }
  @keyframes jf-swim { 0%, 100% { transform: translateY(6px) scale(1, .94); } 50% { transform: translateY(-6px) scale(.96, 1.04); } }
  @keyframes jf-wave { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-8deg); } }
  @keyframes jf-shine { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) {
    #loading .jelly, #loading .jelly i { animation: jf-glow 2s ease-in-out infinite; }
    #loading .bar::after { display: none; }
    @keyframes jf-glow { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  }
</style>
