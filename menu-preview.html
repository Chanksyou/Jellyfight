<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly Fight · living menu preview</title>
<link rel="stylesheet" href="./content/look.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1424;color:#fff6dc;font:14px system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}button{cursor:pointer;font:inherit}#g-over{position:fixed;inset:0;display:grid;align-items:center;z-index:10}#g-over[hidden], [hidden]{display:none!important}#g-over .row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}#g-over .row button{padding:8px 14px;color:inherit;border:1px solid #ffffff30;background:#ffffff1a}#g-over .tag{margin:0}#g-over .keys{font-size:12px;line-height:1.8}#g-quality{font-size:11px;align-items:center}#g-quality button{font-size:11px;min-height:30px!important}#g-over .ver{position:fixed;right:14px;bottom:12px;font-size:11px}#preview-back{position:fixed;z-index:12;bottom:40px;left:50%;transform:translateX(-50%);background:#101a23e8;border:1px solid #a3f5d566;padding:16px 24px;border-radius:18px;text-align:center;max-width:80vw}#preview-back p{line-height:1.6}#preview-back button{padding:10px 20px;border-radius:20px;border:0;background:#ffd46c;color:#101a23}#preview-note{position:fixed;left:16px;top:12px;z-index:11;font-size:10px;opacity:.5;letter-spacing:.08em;pointer-events:none}#g-over .menu-jelly{touch-action:manipulation}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
</head>
<body>
<canvas id="preview-canvas"></canvas>
<div id="g-over"><div>
<h1>Jelly Fight</h1>
<button class="play">Play</button>
<div class="row"><button data-act="creator">Change your look</button><button data-act="sound">🔊 Sound on</button><button data-act="board">🏆 Leaderboard</button></div>
<div class="row" id="g-quality"><span>Graphics</span><button data-q="low">Low</button><button data-q="high">High</button></div>
<div class="ver">Version 205 · menu preview</div>
</div></div>
<div id="preview-back" hidden><b>You’re ready for the night.</b><p>This isolated preview shows the new menu and transition.<br>The full game still lives in the apartment.</p><button>Back to menu</button></div>
<script type="module" src="./src/menu-preview.js"></script>
</body></html>
